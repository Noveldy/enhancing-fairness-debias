# Tiny end-to-end run used by tests/test_protocol.py (minutes, not hours).
# Same code path as configs/main.yaml; fewer rows, folds and grid points.
name: smoke
search_space: configs/search_space_smoke.yaml
outer:
  n_repeats: 1
  n_splits: 2
seeds: [0]
inner:
  n_splits: 2
n_jobs: 4

# Memory safeguard (experiments/memory_guard.py). Per-worker estimate measured with
# scripts/profile_memory.py on an Adult inner fold: largest step = random forest,
# 300 unpruned trees, ~0.8 GB peak (results/diagnostics/). n_jobs is capped so
# n_jobs * per_worker_gb + main_gb fits in free memory minus reserve_gb; the run
# stops with MemoryBudgetExceeded if it uses more than budget_gb (default: free
# memory at start minus reserve) or free memory falls below reserve_gb.
memory:
  per_worker_gb: 1.0
  main_gb: 2.0
  reserve_gb: 2.0
  budget_gb: null

tabular_experiments:
  - name: adult_dbim_smoke
    dataset: adult
    variant: full
    subsample: 2000
    method: dbim
    classifier: random_forest
    domain: finance
    protected: [sex, race]
    stratify_by: sex
    protected_as_feature: true
    drop_features: []
  - name: bank_dbim_smoke
    dataset: bank
    variant: full
    subsample: 2000
    method: dbim
    classifier: decision_tree
    domain: finance
    protected: [marital]
    stratify_by: marital
    protected_as_feature: false
    drop_features: [duration]
