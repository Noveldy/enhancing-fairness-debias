# Every choice the inner cross-validation makes, with its full search range
# (revision Phase 2.3; answers R1.7 "which range of each parameter has been analyzed").
#
# Selection uses inner folds of the outer training set only. The outer test
# fold is never seen during selection. Nothing is trained "until maximum
# accuracy": every candidate is fitted once on an inner training split and
# scored on the matching inner validation split; the best mean score wins,
# and the winner is refitted on the whole outer training set.

# Resampling methods the proposed pipeline chooses from (paper §2.5.1).
resamplers:
  oversampling: [SMOTE, ADASYN, BorderlineSMOTE, KMeansSMOTE, SVMSMOTE]
  undersampling: [CondensedNearestNeighbour, AllKNN, NeighbourhoodCleaningRule, OneSidedSelection, TomekLinks]
  # Original rule (dataset_resampling.py:37): skip the two slowest methods on
  # large data. Applied to the size of the outer training set.
  large_training_rows: 20000
  excluded_when_large: [SVMSMOTE, CondensedNearestNeighbour]
  # Library defaults are used for every resampler, as in the original code;
  # random_state follows the outer-fold seed.

# Imbalance rule that decides whether resampling runs at all (datasets.py:identify_imbalance):
# a target or protected attribute whose smallest class is below this share of
# the training rows is "imbalanced" (mild 20-40%, moderate 1-20%, extreme <1%).
imbalance_threshold_pct: 40

# Classifier hyperparameters, searched jointly with the resampler.
classifiers:
  random_forest:          # Adult (paper §3.2.3)
    n_estimators: [100, 300]
    max_depth: [null, 10, 20]
    min_samples_leaf: [1, 5]
  decision_tree:          # Bank Marketing (paper §3.2.4)
    max_depth: [null, 5, 10, 20]
    min_samples_leaf: [1, 5, 20]

# Selection metric by dataset domain (paper §2.5.1): F1 for healthcare,
# accuracy otherwise. Both datasets here are finance -> accuracy.
selection_metric:
  default: accuracy
  healthcare: f1_weighted
